spring.application.name=eventcloud-api
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/eventcloud}
spring.datasource.username=REDACTED
spring.datasource.password=REDACTED
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
app.jwt.secret=${JWT_SECRET:replace-this-development-secret-with-a-32-byte-minimum-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.upload-dir=${UPLOAD_DIR:./uploads}
app.storage-mode=${STORAGE_MODE:local}
app.s3.bucket=${S3_BUCKET:}
app.s3.region=${AWS_REGION:ap-south-1}
